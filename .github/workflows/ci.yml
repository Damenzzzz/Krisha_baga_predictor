# CI на каждый PR и пуш в main.
#
# parser   — парсер krisha.kz: разбор сохранённых HTML-страниц, нормализация, дедуп.
# offline  — baga-ai без сети и ключей: guardrails (размеченный набор + 64 golden-запроса
#            на ложные срабатывания), регрессия модели цены по out-of-fold, MCP-сервер через
#            MCP-клиента, шлюз LLM (фолбэк, предохранитель, бюджет, кэш), смысловой кэш,
#            авторизация, голос.
# llm      — живые модели, только если заданы секреты: A/B ALEM vs Gemini на golden-наборе
#            разбора запроса с ПОРОГОМ (exact ≥ 90%, выдуманных условий 0) — регрессия промпта
#            или модели роняет сборку; A/B max_tokens на объяснениях.
# docker   — образ собирается (ловит сломанный Dockerfile и зависимости до деплоя).
#
# Поиск по фото (SigLIP + Qdrant) в CI не прогоняется: гигабайты весов и векторов.
# Его evals — python evals.py локально, результаты в EVALS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KrishaParser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "httpx>=0.27" "selectolax>=0.3.21" "beautifulsoup4>=4.12" "lxml>=5.0" playwright python-dotenv tqdm pytest
      - run: pytest tests -q

  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baga-ai
    env:
      TRACING: "0"
      LANGFUSE_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: baga-ai/requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: Guardrails eval
        run: |
          python eval_guardrails.py | tee guardrails.txt
          { echo '### Guardrails'; echo '```'; cat guardrails.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        run: pytest tests -v

  llm:
    runs-on: ubuntu-latest
    needs: offline
    # секреты лежат в GitHub Environment «GEMINI_API_KEY» (Settings → Environments):
    # задача видит их, только если окружение указано явно
    environment: GEMINI_API_KEY
    defaults:
      run:
        working-directory: baga-ai
    env:
      TRACING: "0"
      LANGFUSE_TRACING: "false"
      ALEM_URL: ${{ secrets.ALEM_URL }}
      ALEM_API_KEY: ${{ secrets.ALEM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: baga-ai/requirements-ci.txt
      - name: Check secrets
        id: keys
        run: echo "ok=$([ -n "$GEMINI_API_KEY" ] && [ -n "$ALEM_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.keys.outputs.ok == 'true'
        run: pip install -r requirements-ci.txt
      - name: A/B ALEM vs Gemini — разбор запроса (с порогом качества)
        if: steps.keys.outputs.ok == 'true'
        run: |
          python ab_models.py --only parse --quick --gate | tee parse.txt
          { echo '### A/B разбор запроса'; echo '```'; cat parse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: A/B max_tokens (живая LLM)
        if: steps.keys.outputs.ok == 'true'
        run: |
          python ab_generation.py --only max_tokens --n 4 | tee ab.txt
          { echo '### A/B max_tokens'; echo '```'; cat ab.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: baga-ai
          push: false
          tags: baga-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
